<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Accordion Simples</title>
  <style>
    body { font-family: sans-serif; margin: 30px; }
    button { padding: 10px; width: 220px; font-size: 15px; cursor: pointer; text-align: left; }
    #painel { display: none; width: 200px; padding: 10px; background: #eee; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <h2>Menu Accordion</h2>

  <button onclick="alternar()">O que é o DOM? ▼</button>
  <div id="painel">
    O DOM é a representação do documento HTML em forma de objetos para o JavaScript manipular.
  </div>

  <script>
    function alternar() {
      let painel = document.querySelector("#painel");

      if (painel.style.display === "block") {
        painel.style.display = "none";
      } else {
        painel.style.display = "block";
      }
    }
  </script>

</body>
</html>
