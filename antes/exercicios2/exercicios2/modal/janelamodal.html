<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Modal Simples</title>
  <style>
    body { font-family: sans-serif; margin: 30px; }

    /* Fundo escuro semitransparente que cobre a tela inteira */
    #fundoModal {
      display: none;/*mantém a janela invisível quando a pagina carrega*/
      position: fixed;/*fixa a janela em posição acima dos outros elementos da pagina*/
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* Caixa branca no centro */
    .caixaModal {
      background: white;
      width: 280px;
      margin: 15% auto;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
    }

    button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Exemplo de Modal</h2>

  <button onclick="abrirModal()">Abrir Janela</button>

  <!-- Estrutura do Modal (começa oculta) -->
  <div id="fundoModal">
    <div class="caixaModal">
      <h3>Aviso Importante</h3>
      <p>Esta é uma janela modal sobreposta!</p>
      <button onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <script>
    function abrirModal() {
      document.querySelector("#fundoModal").style.display = "block";
    }

    function fecharModal() {
      document.querySelector("#fundoModal").style.display = "none";
    }
  </script>

</body>
</html>
